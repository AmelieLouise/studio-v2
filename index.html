.zone:hover{box-shadow:0 0 20px #fff inset}
.done{box-shadow:0 0 30px gold,0 0 60px gold inset}

<div id="score">🏆 Harmonie <span id="s">0</span>/4</div>
<div id="piano" class="zone"></div><div id="basse" class="zone"></div>
<div id="casque" class="zone"></div><div id="micro" class="zone"></div>
<div id="modal"></div>

<!-- Mets les mp3 dans le même dossier -->
<audio id="a1" src="1_moins22s(1).mp3" loop></audio>
<audio id="a2" src="2_moins22s(1).mp3" loop></audio>
<audio id="a3" src="3_moins22s(1).mp3" loop></audio>
<audio id="a4" src="4_moins22s(1).mp3" loop></audio>

<script>
const qs=[
{z:'piano',t:'🎹 ÉCOUTER',q:'Lors d’un échange difficile, quelle attitude favorise le plus la compréhension ?',a:['Préparer sa réponse pendant que l’autre parle','Reformuler ce que l’on a compris','Donner rapidement une solution','Partager une expérience similaire'],c:1},
{z:'basse',t:'🎸 NON VERBAL',q:'Lors d’une prise de parole, quel élément influence le plus la perception de ton assurance ?',a:['La richesse du vocabulaire','La quantité d’informations','La posture et la gestuelle','La durée de l’intervention'],c:2},
{z:'casque',t:'🎧 COMMUNAUTÉ',q:'Face à un désaccord, quelle approche renforce le plus la relation ?',a:['Convaincre l’autre de son erreur','Chercher un compromis immédiat','Explorer les besoins de chacun','Reporter la discussion'],c:2},
{z:'micro',t:'🎤 PARLER',q:'Pour maximiser l’impact d’un message important, il est préférable de :',a:['Donner tous les détails dès le début','Structurer son message autour d’une idée clé','Utiliser un vocabulaire technique','Parler plus longtemps'],c:1}
];
let done=[false,false,false,false],started=false;

function startAudio(){
 if(started)return; started=true;
 [a1,a2,a3,a4].forEach(a=>{a.volume=0;a.play().catch(()=>{})});
 a1.volume=1;
}
function fadeIn(a){let v=a.volume;let t=setInterval(()=>{v+=0.05;a.volume=Math.min(v,1);if(v>=1)clearInterval(t)},100)}
function openQ(i){
 if(done[i])return;
 let q=qs[i];
 modal.style.display='block';
 modal.innerHTML='<h2>'+q.t+'</h2><p>'+q.q+'</p>'+q.a.map((r,n)=>`<button onclick="ans(${i},${n})">${r}</button>`).join('')+'<button onclick="modal.style.display=\'none\'">Fermer</button>';
}
function ans(i,n){
 if(n!==qs[i].c){alert('Essaie encore');return;}
 startAudio();
 done[i]=true;
 document.getElementById(qs[i].z).classList.add('done');
 let c=done.filter(Boolean).length;
 s.textContent=c;
 if(c===2)fadeIn(a2);
 if(c===3)fadeIn(a3);
 if(c===4)fadeIn(a4);
 modal.style.display='none';
 if(c===4){
 modal.style.display='block';
 modal.innerHTML='<h1>🏆 TROPHÉE DE L\'HARMONIE</h1><p>🎹 ÉCOUTER • 🎸 NON VERBAL • 🎧 COMMUNAUTÉ • 🎤 PARLER</p><p>📸 Fais une capture d\'écran et envoie-la à Amélie.</p>';
 }
}
piano.onclick=()=>openQ(0); basse.onclick=()=>openQ(1); casque.onclick=()=>openQ(2); micro.onclick=()=>openQ(3);
</script></body></html>
